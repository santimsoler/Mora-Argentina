<text x="349.4" y="219" font-size="12" font-weight="600" fill="#12695F" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">17,1%</text>
<text x="0" y="286" font-size="10.5" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">El denominador correcto depende de que se quiera afirmar</text>
</svg>