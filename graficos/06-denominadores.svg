<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="306" fill="#FFFFFF"/>
<text x="0" y="22" font-size="17" font-weight="700" fill="#0B2239">La misma mora medida sobre cuatro denominadores distintos</text>
<text x="0" y="42" font-size="11.5" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">Cada denominador sostiene una afirmacion diferente</text>
<line x1="0" y1="60" x2="0" y2="234" stroke="#C7D2DA" stroke-width="1" stroke-dasharray="2 4"/>
<text x="0" y="252" font-size="10" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">0%</text>
<line x1="200" y1="60" x2="200" y2="234" stroke="#C7D2DA" stroke-width="1" stroke-dasharray="2 4"/>
<text x="200" y="252" font-size="10" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">10%</text>
<line x1="400" y1="60" x2="400" y2="234" stroke="#C7D2DA" stroke-width="1" stroke-dasharray="2 4"/>
<text x="400" y="252" font-size="10" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">20%</text>
<line x1="600" y1="60" x2="600" y2="234" stroke="#C7D2DA" stroke-width="1" stroke-dasharray="2 4"/>
<text x="600" y="252" font-size="10" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">30%</text>
<text x="0" y="68" font-size="12.5" font-weight="500" fill="#0B2239">CUIT unicos (humanas + sociedades)</text>
<rect x="0" y="74" width="557.8" height="16" fill="#B07C1E"/>
<text x="565,8" y="87" font-size="12" font-weight="600" fill="#B07C1E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">27,9%</text>
<text x="0" y="112" font-size="12.5" font-weight="500" fill="#0B2239">Personas humanas registradas</text>
<rect x="0" y="118" width="561.4" height="16" fill="#B07C1E"/>
<text x="569,4" y="131" font-size="12" font-weight="600" fill="#B07C1E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">28,1%</text>
<text x="0" y="156" font-size="12.5" font-weight="500" fill="#0B2239">Sociedades registradas</text>
<rect x="0" y="162" width="303.6" height="16" fill="#12695F"/>
<text x="311,6" y="175" font-size="12" font-weight="600" fill="#12695F" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">15,2%</text>
<text x="0" y="200" font-size="12.5" font-weight="500" fill="#0B2239">Poblacion adulta 18+</text>
<rect x="0" y="206" width="336.0" height="16" fill="#12695F"/>
<text x="344,0" y="219" font-size="12" font-weight="600" fill="#12695F" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">16,8%</text>
<text x="0" y="292" font-size="10.5" fill="#5C6E7E" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace">El denominador correcto depende de que se quiera afirmar</text>
</svg>
